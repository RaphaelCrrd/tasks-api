name: Secret Demo

on:
  workflow_dispatch:

jobs:
  demo:
    runs-on: ubuntu-latest
    env:
      DEMO_TOKEN: ${{ secrets.DEMO_TOKEN }}
      APP_ENV: ${{ vars.APP_ENV }}
    steps:
      - name: Vérifier et afficher les variables et secrets
        run: |
          if [ -z "$DEMO_TOKEN" ]; then
            exit 1
          fi
          echo "Longueur du secret : ${#DEMO_TOKEN}"
          echo "Essai d'affichage du secret : $DEMO_TOKEN"
          echo "Valeur de APP_ENV : $APP_ENV"